<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Question Bank · ExamHall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
.subject-accordion { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; background: var(--card); overflow: hidden; box-shadow: var(--shadow-card); }
.subject-accordion__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; cursor: pointer; user-select: none; gap: 12px; }
.subject-accordion__header:hover { background: var(--paper-2); }
.subject-accordion__title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; color: var(--ink); margin: 0; }
.subject-accordion__meta { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.subject-accordion__body { display: none; border-top: 1px solid var(--line); padding: 16px 20px; }
.subject-accordion__body.open { display: block; }
.subject-accordion__toggle { font-family: var(--font-mono); font-size: 1rem; color: var(--graphite-60); transition: transform .2s; }
.subject-accordion__toggle.open { transform: rotate(180deg); }
.q-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
.q-row:last-child { border-bottom: none; padding-bottom: 0; }
.q-row__top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.q-row__text { font-weight: 500; color: var(--ink); flex: 1; min-width: 200px; }
.q-row__opts { display: flex; gap: 10px; flex-wrap: wrap; font-size: .85rem; color: var(--graphite-60); margin-top: 6px; }
.q-row__actions { display: flex; gap: 8px; align-items: flex-start; flex-shrink: 0; }
.subject-filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.q-row__select { display: flex; align-items: flex-start; gap: 10px; }
.q-row__select input[type=checkbox] { margin-top: 4px; width: auto; }
.bulk-bar {
  position: sticky; top: 8px; z-index: 10; display: none; align-items: center; justify-content: space-between;
  gap: 12px; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--radius);
  margin-bottom: 16px; font-size: .85rem; font-family: var(--font-mono);
}
.bulk-bar.show { display: flex; }
</style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="page">
  <div class="page-head">
    <div>
      <span class="eyebrow">Admin</span>
      <h1>Question Bank</h1>
      <p id="count-label"></p>
    </div>
    <a class="btn btn--gold" href="/admin-question-form.html">+ Add question</a>
  </div>

  <div id="subject-filter" class="subject-filter-row"></div>

  <div class="bulk-bar" id="bulk-bar">
    <span><strong id="bulk-count">0</strong> selected</span>
    <div class="btn-row" style="margin:0;">
      <button class="btn btn--outline btn--sm" id="bulk-clear-btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3);">Clear</button>
      <button class="btn btn--danger btn--sm" id="bulk-delete-btn">Delete selected</button>
    </div>
  </div>

  <div id="bank-container"></div>
</main>
<footer class="site-footer"><span>ExamHall — Online Examination System</span></footer>

<script src="/api.js"></script>
<script>
  (async () => {
    const me = await initPage('admin');
    if (!me) return;

    let activeSubject = new URLSearchParams(window.location.search).get('subject') || '';

    function updateBulkBar() {
      const checked = document.querySelectorAll('.q-select-cb:checked');
      const bar = document.getElementById('bulk-bar');
      document.getElementById('bulk-count').textContent = String(checked.length);
      bar.classList.toggle('show', checked.length > 0);
    }

    async function load() {
      const { questions, categories } = await apiGet('/api/admin/questions');

      const container = document.getElementById('bank-container');
      const countLabel = document.getElementById('count-label');
      const filterEl = document.getElementById('subject-filter');

      if (questions.length === 0) {
        filterEl.innerHTML = '';
        countLabel.textContent = '0 questions total';
        container.innerHTML = `
          <div class="card empty-state">
            <h3>No questions yet</h3>
            <p>Add your first question to start building the bank.</p>
            <a class="btn btn--gold" href="/admin-question-form.html" style="margin-top:12px;">+ Add question</a>
          </div>`;
        return;
      }

      countLabel.textContent = `${questions.length} question${questions.length === 1 ? '' : 's'} across ${categories.length} subject${categories.length === 1 ? '' : 's'}`;

      // Group by category
      const byCategory = {};
      categories.forEach(cat => byCategory[cat] = []);
      questions.forEach(q => {
        if (!byCategory[q.category]) byCategory[q.category] = [];
        byCategory[q.category].push(q);
      });

      // Subject filter chips — click a subject to show only its MCQs
      filterEl.innerHTML = `
        <a href="#" class="filter-chip subject-filter-chip ${activeSubject === '' ? 'is-active' : ''}" data-subject="">All subjects (${questions.length})</a>
        ${categories.map((cat) => `<a href="#" class="filter-chip subject-filter-chip ${activeSubject === cat ? 'is-active' : ''}" data-subject="${escapeHtml(cat)}">${escapeHtml(cat)} (${byCategory[cat].length})</a>`).join('')}
      `;
      filterEl.querySelectorAll('.subject-filter-chip').forEach((chip) => {
        chip.addEventListener('click', (e) => {
          e.preventDefault();
          activeSubject = chip.dataset.subject;
          renderList();
        });
      });

      const visibleCats = activeSubject ? categories.filter((c) => c === activeSubject) : categories;

      function renderList() {
        filterEl.querySelectorAll('.subject-filter-chip').forEach((chip) => {
          chip.classList.toggle('is-active', chip.dataset.subject === activeSubject);
        });
        const catsToShow = activeSubject ? categories.filter((c) => c === activeSubject) : categories;

        container.innerHTML = catsToShow.map((cat) => {
        const qs = byCategory[cat];
        return `
          <div class="subject-accordion" id="acc-${encodeURIComponent(cat)}">
            <div class="subject-accordion__header" data-cat="${escapeHtml(cat)}">
              <div>
                <div class="subject-accordion__title">${escapeHtml(cat)}</div>
              </div>
              <div class="subject-accordion__meta">
                <span class="pill pill--gold">${qs.length} question${qs.length === 1 ? '' : 's'}</span>
                <a class="btn btn--outline btn--sm" href="/admin-question-form.html?subject=${encodeURIComponent(cat)}" onclick="event.stopPropagation()">+ Add here</a>
                <span class="subject-accordion__toggle">▼</span>
              </div>
            </div>
            <div class="subject-accordion__body" id="body-${encodeURIComponent(cat)}">
              ${qs.map(q => `
                <div class="q-row" data-id="${q.id}">
                  <div class="q-row__top">
                    <div class="q-row__select" style="flex:1;">
                      <input type="checkbox" class="q-select-cb" value="${q.id}" />
                      <div style="flex:1;">
                        <div style="margin-bottom:5px;">
                          <span class="pill pill--gray">${escapeHtml(q.difficulty)}</span>
                          <span class="pill pill--green">Correct: ${q.correct_option}</span>
                        </div>
                        <div class="q-row__text">${escapeHtml(q.question_text)}</div>
                        <div class="q-row__opts">
                          <span>A. ${escapeHtml(q.option_a)}</span>
                          <span>B. ${escapeHtml(q.option_b)}</span>
                          <span>C. ${escapeHtml(q.option_c)}</span>
                          <span>D. ${escapeHtml(q.option_d)}</span>
                        </div>
                      </div>
                    </div>
                    <div class="q-row__actions">
                      <a class="btn btn--outline btn--sm" href="/admin-question-form.html?id=${q.id}">Edit</a>
                      <button class="btn btn--outline btn--sm duplicate-btn" data-id="${q.id}">Duplicate</button>
                      <button class="btn btn--danger btn--sm delete-btn" data-id="${q.id}">Delete</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        }).join('');

        // Toggle accordion
        container.querySelectorAll('.subject-accordion__header').forEach((header) => {
          header.addEventListener('click', () => {
            const cat = header.dataset.cat;
            const body = document.getElementById(`body-${encodeURIComponent(cat)}`);
            const toggle = header.querySelector('.subject-accordion__toggle');
            body.classList.toggle('open');
            toggle.classList.toggle('open');
          });
        });

        // Open all accordions when a specific subject is selected; else open the first one
        if (catsToShow.length > 0) {
          if (activeSubject) {
            container.querySelectorAll('.subject-accordion__body').forEach((b) => b.classList.add('open'));
            container.querySelectorAll('.subject-accordion__toggle').forEach((t) => t.classList.add('open'));
          } else {
            document.getElementById(`body-${encodeURIComponent(catsToShow[0])}`).classList.add('open');
            const firstToggle = container.querySelector('.subject-accordion__toggle');
            if (firstToggle) firstToggle.classList.add('open');
          }
        }

        // Delete buttons
        container.querySelectorAll('.delete-btn').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (!confirm('Delete this question? This also removes it from any exams.')) return;
            await apiDelete(`/api/admin/questions/${btn.dataset.id}`);
            showToast('Question deleted.', 'success');
            load();
          });
        });

        // Duplicate buttons
        container.querySelectorAll('.duplicate-btn').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            btn.disabled = true;
            try {
              await apiPost(`/api/admin/questions/${btn.dataset.id}/duplicate`);
              showToast('Question duplicated — edit the copy as needed.', 'success');
              load();
            } catch (err) {
              showToast(err.message, 'error');
              btn.disabled = false;
            }
          });
        });

        // Selection checkboxes
        container.querySelectorAll('.q-select-cb').forEach((cb) => {
          cb.addEventListener('click', (e) => e.stopPropagation());
          cb.addEventListener('change', updateBulkBar);
        });
        updateBulkBar();
      }

      renderList();
    }

    document.getElementById('bulk-clear-btn').addEventListener('click', () => {
      document.querySelectorAll('.q-select-cb:checked').forEach((cb) => { cb.checked = false; });
      updateBulkBar();
    });

    document.getElementById('bulk-delete-btn').addEventListener('click', async () => {
      const ids = Array.from(document.querySelectorAll('.q-select-cb:checked')).map((cb) => Number(cb.value));
      if (ids.length === 0) return;
      if (!confirm(`Delete ${ids.length} selected question(s)? This also removes them from any exams.`)) return;
      await apiPost('/api/admin/questions/bulk-delete', { ids });
      showToast(`${ids.length} question(s) deleted.`, 'success');
      load();
    });

    load();
  })();
</script>
</body>
</html>
