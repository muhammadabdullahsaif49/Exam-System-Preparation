<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in · ExamHall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="page">
  <div class="auth-shell">
    <div class="card">
      <span class="eyebrow" style="text-align:center; display:block;">ExamHall</span>
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to take a test or manage the question bank.</p>

      <div id="error-box" class="form-alert" style="display:none;"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autofocus />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button class="btn btn--gold btn--block" type="submit">Log in</button>
      </form>

      <p class="auth-switch">New here? <a href="/register.html">Create a student account</a></p>
    </div>
  </div>
</main>
<footer class="site-footer"><span>ExamHall — Online Examination System</span></footer>

<script src="/api.js"></script>
<script>
  initPage('guest');

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('error-box');
    errorBox.style.display = 'none';
    try {
      const { user } = await apiPost('/api/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      window.location.href = user.role === 'admin' ? '/admin.html' : '/index.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
</script>
</body>
</html>
